<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E100B">
<title>Aziz Akkeb · Head of Product</title>

<meta name="description" content="Head of Product B2B, je transforme des besoins business complexes en produits techniques qui tiennent sur le terrain.">
<meta property="og:title" content="Aziz Akkeb · Head of Product">
<meta property="og:description" content="Je transforme des besoins business complexes en produits techniques qui tiennent sur le terrain, de la discovery à la qualité de détection jusqu'à l'intégration partenaire.">
<meta property="og:type" content="website">
<meta property="og:image" content="og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Aziz Akkeb · Head of Product">
<meta name="twitter:description" content="I turn complex business needs into technical products that hold up in the field: discovery, detection quality, partner integration.">
<meta name="twitter:image" content="og-cover.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --void:#0E100B; --ivory:#E8E5D8; --sage:#7AAF8A; --sage-deep:#3D6B4F;
    --amber:#C4A876; --dim:#6A7162; --line:rgba(122,175,138,0.16);
    --panel:#14170F;
  }

  html, body {
    height:100%; background:var(--void); color:var(--ivory);
    font-family:'DM Sans', system-ui, -apple-system, sans-serif;
    overflow:hidden; overscroll-behavior:none;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  .stage {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:
      calc(env(safe-area-inset-top) + 28px)
      calc(env(safe-area-inset-right) + 24px)
      calc(env(safe-area-inset-bottom) + 28px)
      calc(env(safe-area-inset-left) + 24px);
    height:100vh; height:100dvh; isolation:isolate;
  }

  .grid { position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(circle, rgba(122,175,138,0.10) 1px, transparent 1px);
    background-size:30px 30px; animation:drift 40s linear infinite; }
  .vignette { position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 38%, rgba(6,8,5,0.9) 100%); }
  .glow { position:fixed; z-index:0; pointer-events:none;
    width:70vmin; height:70vmin; left:50%; top:52%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(122,175,138,0.14), transparent 62%);
    filter:blur(20px); animation:breatheGlow 9s ease-in-out infinite; }

  .bracket { position:fixed; z-index:1; pointer-events:none; width:26px; height:26px;
    border:1.5px solid var(--line); opacity:0; animation:fadeIn 1s ease 0.3s both; }
  .bracket.tl { top:calc(env(safe-area-inset-top) + 18px);    left:calc(env(safe-area-inset-left) + 18px);   border-right:0; border-bottom:0; }
  .bracket.tr { top:calc(env(safe-area-inset-top) + 18px);    right:calc(env(safe-area-inset-right) + 18px); border-left:0;  border-bottom:0; }
  .bracket.bl { bottom:calc(env(safe-area-inset-bottom) + 18px); left:calc(env(safe-area-inset-left) + 18px); border-right:0; border-top:0; }
  .bracket.br { bottom:calc(env(safe-area-inset-bottom) + 18px); right:calc(env(safe-area-inset-right) + 18px); border-left:0; border-top:0; }

  /* language HUD (top-left, mirrors the eyebrow) */
  .lang-seg { position:absolute; z-index:6; top:calc(env(safe-area-inset-top) + 20px);
    left:calc(env(safe-area-inset-left) + 22px);
    display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
    background:rgba(20,23,15,0.6); backdrop-filter:blur(8px);
    opacity:0; animation:fadeDown 0.9s ease 0.2s both; }
  .lang-seg button { border:0; background:none; color:var(--dim); cursor:pointer;
    height:30px; padding:0 11px; font-size:.64rem; font-weight:700; letter-spacing:.12em;
    font-family:inherit; transition:color .3s, background .3s; }
  .lang-seg button[aria-pressed="true"] { color:var(--void); background:var(--sage); }
  .lang-seg button:focus-visible { outline:2px solid var(--sage); outline-offset:-2px; }

  .eyebrow { position:absolute; z-index:2; top:calc(env(safe-area-inset-top) + 26px);
    left:0; right:0; text-align:center; font-size:0.68rem; font-weight:600;
    letter-spacing:0.28em; text-transform:uppercase; color:var(--dim);
    display:flex; align-items:center; justify-content:center; gap:10px;
    opacity:0; animation:fadeDown 0.9s ease 0.1s both; pointer-events:none; }
  .eyebrow .live { width:6px; height:6px; border-radius:50%; background:var(--sage);
    box-shadow:0 0 8px var(--sage); animation:pulseLive 2.4s ease-in-out infinite; }

  .hero { position:relative; z-index:2; text-align:center;
    animation:focusIn 1.3s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .kicker { font-size:0.7rem; font-weight:600; letter-spacing:0.34em; text-transform:uppercase;
    color:var(--amber); margin-bottom:0.9rem; }
  .name { font-family:'Cormorant Garamond', Georgia, serif; font-weight:600;
    font-size:clamp(3.4rem, 16vw, 9rem); line-height:0.9; letter-spacing:-0.01em; color:var(--ivory); }
  .name em { font-style:normal; font-weight:600; color:var(--ivory); }
  .tagline { margin-top:1.5rem; font-size:clamp(0.95rem, 2.7vw, 1.16rem); font-weight:400;
    line-height:1.55; color:var(--ivory); opacity:0.82; max-width:40ch; margin-left:auto; margin-right:auto; }
  .tagline b { color:var(--sage); font-weight:600; opacity:1; }

  .enter { position:relative; z-index:2; margin-top:clamp(2.4rem, 6vh, 3.6rem);
    display:flex; flex-direction:column; align-items:center; gap:0.85rem;
    background:none; border:0; cursor:pointer; color:inherit; font:inherit;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; opacity:0; animation:rise 0.9s ease 0.6s both; }
  .reticle { width:clamp(96px, 23vw, 130px); height:clamp(96px, 23vw, 130px); display:block; overflow:visible; }
  .r-track { fill:none; stroke:var(--line); stroke-width:1; }
  .r-scan { fill:none; stroke:var(--sage); stroke-width:1.5; stroke-linecap:round;
    transform-origin:50% 50%; animation:spin 5.5s linear infinite; }
  .r-brackets { transform-origin:50% 50%; animation:breathe 4.5s ease-in-out infinite; }
  .r-bracket { fill:none; stroke:var(--sage); stroke-width:2; stroke-linecap:round; }
  .r-dot { fill:var(--amber); animation:pulseDot 2.4s ease-in-out infinite; }
  .r-lock { fill:none; stroke:var(--sage); stroke-width:2; stroke-dasharray:289; stroke-dashoffset:289;
    transform:rotate(-90deg); transform-origin:50% 50%; }

  .enter-label { font-size:0.72rem; font-weight:600; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--ivory); opacity:0.85; transition:opacity 0.3s, color 0.3s; }
  .kbd-hint { font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); display:none; }

  .enter:focus-visible { outline:none; }
  .enter:focus-visible .r-track { stroke:var(--sage); }
  .enter:focus-visible .enter-label { opacity:1; color:var(--sage); }

  @media (hover:hover) and (pointer:fine) {
    .kbd-hint { display:block; }
    .enter:hover .r-brackets { animation-play-state:paused; transform:scale(0.9); transition:transform 0.4s; }
    .enter:hover .r-track { stroke:rgba(122,175,138,0.4); transition:stroke 0.4s; }
    .enter:hover .enter-label { opacity:1; color:var(--sage); }
    .reticle { transition:filter 0.4s; }
    .enter:hover .reticle { filter:drop-shadow(0 0 14px rgba(122,175,138,0.45)); }
  }
  .enter:active .r-brackets { transform:scale(0.86); transition:transform 0.15s; }

  .meta { position:absolute; z-index:2; bottom:calc(env(safe-area-inset-bottom) + 22px);
    left:calc(env(safe-area-inset-left) + 26px); right:calc(env(safe-area-inset-right) + 26px);
    display:flex; justify-content:space-between; font-size:0.66rem; font-weight:500;
    letter-spacing:0.2em; text-transform:uppercase; color:var(--dim);
    opacity:0; animation:fadeUp 0.9s ease 0.7s both; }

  .flash { position:fixed; inset:0; z-index:5; pointer-events:none; background:var(--sage); opacity:0; }

  .stage.leaving .hero      { animation:heroOut 0.55s ease forwards; }
  .stage.leaving .r-brackets{ animation:lockIn 0.32s cubic-bezier(.3,.8,.2,1) forwards; }
  .stage.leaving .r-lock    { animation:draw 0.42s ease forwards; }
  .stage.leaving .r-dot     { animation:dotFlare 0.4s ease forwards; }
  .stage.leaving .flash     { animation:flash 0.5s ease forwards; }
  .stage.leaving .eyebrow,
  .stage.leaving .meta,
  .stage.leaving .lang-seg,
  .stage.leaving .enter-label,
  .stage.leaving .kbd-hint  { animation:fadeOut 0.35s ease forwards; }
  .stage.leaving            { animation:stageOut 0.55s ease 0.18s forwards; }

  @keyframes focusIn  { from { filter:blur(7px); opacity:0; transform:translateY(16px); } to { filter:blur(0); opacity:1; transform:none; } }
  @keyframes rise     { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(10px); } to { opacity:0.72; transform:none; } }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } }
  @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeOut  { to   { opacity:0; } }
  @keyframes drift    { to   { background-position:30px 30px; } }
  @keyframes breatheGlow { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
  @keyframes pulseLive{ 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  @keyframes spin     { to { transform:rotate(360deg); } }
  @keyframes breathe  { 0%,100% { transform:scale(1.12); } 50% { transform:scale(1.16); } }
  @keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
  @keyframes lockIn   { to { transform:scale(0.82); } }
  @keyframes draw     { to { stroke-dashoffset:0; } }
  @keyframes dotFlare { 0% { transform:scale(1); } 40% { transform:scale(2.4); } 100% { transform:scale(0); opacity:0; } }
  @keyframes flash    { 0% { opacity:0; } 30% { opacity:0.5; } 100% { opacity:0; } }
  @keyframes heroOut  { to { opacity:0; transform:translateY(-18px) scale(1.03); filter:blur(4px); } }
  @keyframes stageOut { to { opacity:0; } }

  @media (prefers-reduced-motion:reduce) {
    .grid, .glow, .r-scan, .r-brackets, .r-dot, .eyebrow .live { animation:none !important; }
    .hero, .enter, .eyebrow, .meta, .bracket, .lang-seg { animation:none !important; opacity:1 !important; filter:none !important; transform:none !important; }
    .meta { opacity:0.72 !important; }
    .stage.leaving * { animation-duration:0.01s !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="grid" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <span class="bracket tl" aria-hidden="true"></span>
    <span class="bracket tr" aria-hidden="true"></span>
    <span class="bracket bl" aria-hidden="true"></span>
    <span class="bracket br" aria-hidden="true"></span>
    <div class="flash" id="flash" aria-hidden="true"></div>

    <div class="lang-seg" role="group" aria-label="Language / Langue">
      <button id="lang-fr" aria-pressed="true" onclick="setLang('fr')">FR</button>
      <button id="lang-en" aria-pressed="false" onclick="setLang('en')">EN</button>
    </div>

    <div class="eyebrow"><span class="live"></span><span data-en="Head of Product · Lyon, France">Head of Product · ProovStation</span></div>

    <main class="hero">
      <p class="kicker" data-en="Portfolio">Portfolio</p>
      <h1 class="name">Aziz<br><em>Akkeb</em></h1>
      <p class="tagline" data-en-html="I turn <b>complex business needs into technical products that hold up in the field</b>, from discovery to detection quality to partner integration.">Je transforme des <b>besoins business complexes en produits techniques qui tiennent sur le terrain</b>, de la discovery à la qualité de détection jusqu'à l'intégration partenaire.</p>
    </main>

    <button class="enter" id="enter" aria-label="Entrer dans le portfolio">
      <svg class="reticle" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="r-track" cx="50" cy="50" r="46"></circle>
        <circle class="r-scan"  cx="50" cy="50" r="46" stroke-dasharray="34 255"></circle>
        <circle class="r-lock"  cx="50" cy="50" r="46"></circle>
        <g class="r-brackets">
          <path class="r-bracket" d="M28 34 V28 H34"></path>
          <path class="r-bracket" d="M72 34 V28 H66"></path>
          <path class="r-bracket" d="M28 66 V72 H34"></path>
          <path class="r-bracket" d="M72 66 V72 H66"></path>
        </g>
        <circle class="r-dot" cx="50" cy="50" r="3.4" style="transform-origin:50px 50px"></circle>
      </svg>
      <span class="enter-label" data-en="Enter">Entrer</span>
      <span class="kbd-hint" data-en="or press Enter">ou touche Entrée</span>
    </button>

    <footer class="meta">
      <span>Lyon, France</span>
      <span>2026</span>
    </footer>
  </div>

<script>
  (function () {
    var stage = document.getElementById('stage');
    var btn = document.getElementById('enter');
    var entered = false;

    // ---- i18n ----
    var nodes = document.querySelectorAll('[data-en],[data-en-html]');
    nodes.forEach(function (el) { el.dataset.fr = el.innerHTML; });
    function applyLang(lang) {
      document.documentElement.lang = lang;
      nodes.forEach(function (el) {
        el.innerHTML = (lang === 'en') ? (el.dataset.enHtml || el.dataset.en || el.dataset.fr) : el.dataset.fr;
      });
      document.getElementById('lang-fr').setAttribute('aria-pressed', lang === 'fr');
      document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en');
      try { localStorage.setItem('aa_lang', lang); } catch (e) {}
    }
    window.setLang = applyLang;
    var saved; try { saved = localStorage.getItem('aa_lang'); } catch (e) {}
    var navFr = (navigator.language || 'en').toLowerCase().indexOf('fr') === 0;
    applyLang(saved || (navFr ? 'fr' : 'en'));

    // ---- lock-on sound ----
    function tick() {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var ctx = new Ctx(); var now = ctx.currentTime;
        [[720, 0], [1080, 0.07]].forEach(function (p) {
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = p[0];
          o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.0001, now + p[1]);
          g.gain.exponentialRampToValueAtTime(0.07, now + p[1] + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, now + p[1] + 0.15);
          o.start(now + p[1]); o.stop(now + p[1] + 0.17);
        });
      } catch (e) {}
    }

    function enter() {
      if (entered) return;
      entered = true;
      tick();
      stage.classList.add('leaving');
      setTimeout(function () { window.location.href = 'CV_Portfolio_Aziz_Akkeb_Light.html'; }, 680);
    }

    btn.addEventListener('click', enter);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !entered && document.activeElement && document.activeElement.tagName !== 'BUTTON') enter();
      else if (e.key === 'Enter' && !entered && document.activeElement === btn) enter();
    });
  })();
</script>
</body>
</html>
